name: Release Build

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (empty = auto 1.0.7-<run_number>-alpha)'
        required: false
        default: ''
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install npm dependencies
        run: npm ci

      - name: Svelte Typecheck
        run: npm run check

      - name: Prepare Release Version
        shell: powershell
        run: |
          $rawInput = "${{ inputs.tag_name }}".Trim()
          $ver = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } elseif ($rawInput) {
            $rawInput
          } else {
            "1.0.7-${{ github.run_number }}-alpha"
          }

          $pkgVer = $ver -replace '^[vV]', ''
          $isPrerelease = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.prerelease }}"
          } elseif ($ver -match '(?i)(alpha|beta|rc)') {
            "true"
          } else {
            "false"
          }

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          $pkgPath = Join-Path $PWD "package.json"
          $pkg = [System.IO.File]::ReadAllText($pkgPath) | ConvertFrom-Json
          $pkg.version = $pkgVer
          [System.IO.File]::WriteAllText($pkgPath, ($pkg | ConvertTo-Json -Depth 100), $utf8NoBom)

          $tauriPath = Join-Path $PWD "src-tauri\tauri.conf.json"
          $tauriConf = [System.IO.File]::ReadAllText($tauriPath) | ConvertFrom-Json
          $tauriConf.version = $pkgVer
          [System.IO.File]::WriteAllText($tauriPath, ($tauriConf | ConvertTo-Json -Depth 100), $utf8NoBom)

          $cargoPath = Join-Path $PWD "src-tauri\Cargo.toml"
          $cargoToml = [System.IO.File]::ReadAllText($cargoPath)
          $cargoToml = [regex]::Replace($cargoToml, '(?m)^version\s*=\s*"[^"]+"', "version = `"$pkgVer`"", 1)
          [System.IO.File]::WriteAllText($cargoPath, $cargoToml, $utf8NoBom)

          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "RELEASE_VERSION=$ver`nIS_PRERELEASE=$isPrerelease`n", $utf8NoBom)

      - name: Build Tauri Release Binary
        run: npx tauri build

      - name: Package Release Artifacts (EXE + DLL + Docs)
        shell: powershell
        run: |
          $ver = $env:RELEASE_VERSION

          $pkgDir = "OmniHarness-$ver-win64"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null

          Copy-Item "src-tauri\target\release\omni-harness.exe" -Destination $pkgDir -Force

          # Locate x64 WebView2Loader.dll in target directory
          $dllItem = Get-ChildItem -Path "src-tauri\target" -Filter "WebView2Loader.dll" -Recurse |
            Where-Object { ($_.FullName -match "\\x64\\" -or $_.DirectoryName -match "x64") -and $_.Length -gt 100000 } |
            Select-Object -First 1

          if (-not $dllItem) {
            $dllItem = Get-ChildItem -Path "src-tauri\target" -Filter "WebView2Loader.dll" -Recurse |
              Where-Object { $_.Length -gt 100000 } |
              Select-Object -First 1
          }

          if (-not $dllItem) {
            throw "WebView2Loader.dll not found in src-tauri\target"
          }

          Write-Output "Found WebView2Loader.dll at: $($dllItem.FullName) ($($dllItem.Length) bytes)"
          Copy-Item $dllItem.FullName -Destination "$pkgDir\WebView2Loader.dll" -Force
          Copy-Item $dllItem.FullName -Destination "src-tauri\target\release\WebView2Loader.dll" -Force
          Copy-Item "README.md" -Destination $pkgDir -Force
          Copy-Item "LICENSE" -Destination $pkgDir -Force

          $zipFile = "OmniHarness-$ver-win64.zip"
          Compress-Archive -Path "$pkgDir\*" -DestinationPath $zipFile -Force

          $hashExe = (Get-FileHash "$pkgDir\omni-harness.exe" -Algorithm SHA256).Hash
          $hashDll = (Get-FileHash "$pkgDir\WebView2Loader.dll" -Algorithm SHA256).Hash
          $hashZip = (Get-FileHash $zipFile -Algorithm SHA256).Hash

          $checksums = @"
          $hashExe  omni-harness.exe
          $hashDll  WebView2Loader.dll
          $hashZip  $zipFile
          "@
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD "checksums.txt"), "$checksums`n", $utf8NoBom)

          Write-Output "Artifacts ready:"
          Get-ChildItem -Path $pkgDir
          Write-Output "Archive created: $zipFile"
          Get-Content "checksums.txt"

          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ZIP_PATH=$zipFile`n", $utf8NoBom)

      - name: Upload Build Artifacts (Actions Storage)
        uses: actions/upload-artifact@v4
        with:
          name: OmniHarness-${{ env.RELEASE_VERSION }}-win64
          path: |
            ${{ env.ZIP_PATH }}
            src-tauri/target/release/omni-harness.exe
            src-tauri/target/release/WebView2Loader.dll
            checksums.txt
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: OmniHarness ${{ env.RELEASE_VERSION }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: |
            ${{ env.ZIP_PATH }}
            src-tauri/target/release/omni-harness.exe
            src-tauri/target/release/WebView2Loader.dll
            checksums.txt
